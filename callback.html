<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Discord</title>

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f5f7fa;
  font-family:Arial,sans-serif;
  color:#111827;
}

.card{
  width:90%;
  max-width:420px;
  background:white;
  padding:30px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 10px 30px #0001;
}

h1{margin-top:0}
#status{color:#666}
</style>
</head>

<body>

<div class="card">
  <h1>Entrando...</h1>
  <p id="status">Verificando sua conta do Discord.</p>
</div>

<script>
const params=new URLSearchParams(location.search);
const code=params.get("code");

if(!code){
  document.getElementById("status").textContent=
    "Não foi possível obter o código de login.";
}else{
  document.getElementById("status").textContent=
    "Login autorizado pelo Discord.";
}
</script>

</body>
</html>
