<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Urna Eletrônica | Cidade Alta RP</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#d7d7d7;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:#111
}

.urna{
width:94%;
max-width:850px;
background:#aaa;
border:3px solid #777;
border-radius:12px;
padding:22px;
box-shadow:0 12px 30px #777;
display:grid;
grid-template-columns:1fr 230px;
gap:22px
}

.tela{
background:#111;
padding:13px;
border-radius:5px;
box-shadow:inset 0 0 0 2px #555
}

.lcd{
background:#e9eadf;
min-height:420px;
padding:25px;
font-family:monospace;
position:relative
}

.titulo{
font-size:20px;
font-weight:bold;
border-bottom:1px solid #555;
padding-bottom:10px;
margin-bottom:20px
}

.linha{
font-size:17px;
margin:10px 0
}

.numero{
font-size:27px;
font-weight:bold;
letter-spacing:5px;
margin:18px 0
}

.candidato{
display:none;
margin-top:20px
}

.candidato img{
width:110px;
height:135px;
object-fit:cover;
border:2px solid #222;
background:#ccc;
float:right;
margin-left:15px
}

.nome{
font-size:19px;
font-weight:bold
}

.partido{
margin-top:8px;
font-size:16px
}

.mensagem{
font-size:25px;
font-weight:bold;
text-align:center;
padding-top:120px
}

.teclado{
background:#222;
border-radius:8px;
padding:15px
}

.teclas{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:9px
}

.tecla{
height:55px;
border:0;
border-radius:6px;
background:#111;
color:white;
font-size:20px;
font-weight:bold;
box-shadow:0 3px 0 #000;
cursor:pointer
}

.tecla:active{
transform:translateY(2px);
box-shadow:0 1px 0 #000
}

.branco{
background:#fff;
color:#111
}

.corrige{
background:#e8d100;
color:#111
}

.confirma{
background:#159447;
color:white
}

.acoes{
margin-top:12px;
display:grid;
grid-template-columns:1fr 1fr;
gap:9px
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.7);
display:flex;
align-items:center;
justify-content:center;
padding:20px;
z-index:20
}

.login{
background:#fff;
width:100%;
max-width:390px;
padding:25px;
border-radius:12px;
box-shadow:0 10px 30px #222
}

.login h2{
margin:0 0 7px
}

.login p{
font-size:13px;
color:#777;
margin-bottom:20px
}

.login input{
width:100%;
padding:13px;
border:1px solid #bbb;
border-radius:7px;
font-size:17px;
margin-bottom:10px
}

.login button{
width:100%;
padding:13px;
border:0;
border-radius:7px;
background:#111;
color:white;
font-weight:bold;
font-size:15px;
cursor:pointer
}

.erro{
display:none;
color:#c00;
font-size:13px;
margin-bottom:10px
}

@media(max-width:700px){
.urna{
grid-template-columns:1fr;
padding:12px
}

.lcd{
min-height:390px
}

.teclado{
max-width:400px;
margin:auto;
width:100%
}
}
</style>
</head>

<body>

<div class="urna">

<div class="tela">
<div class="lcd">

<div id="conteudo">

<div class="titulo" id="cargoNome">
DEPUTADO FEDERAL
</div>

<div class="linha">
Digite o número:
</div>

<div class="numero" id="numero">
_
</div>

<div class="candidato" id="candidato">

<img id="foto" src="" alt="">

<div class="nome" id="nome"></div>
<div class="partido" id="partido"></div>

</div>

</div>

</div>
</div>

<div class="teclado">

<div class="teclas">

<button class="tecla" onclick="digitar('1')">1</button>
<button class="tecla" onclick="digitar('2')">2</button>
<button class="tecla" onclick="digitar('3')">3</button>

<button class="tecla" onclick="digitar('4')">4</button>
<button class="tecla" onclick="digitar('5')">5</button>
<button class="tecla" onclick="digitar('6')">6</button>

<button class="tecla" onclick="digitar('7')">7</button>
<button class="tecla" onclick="digitar('8')">8</button>
<button class="tecla" onclick="digitar('9')">9</button>

<button class="tecla" onclick="digitar('0')">0</button>

</div>

<div class="acoes">

<button class="tecla branco" onclick="branco()">
BRANCO
</button>

<button class="tecla corrige" onclick="corrigir()">
CORRIGE
</button>

<button class="tecla confirma" onclick="confirmar()">
CONFIRMA
</button>

</div>

</div>

</div>

<div id="loginOverlay" class="overlay">

<div class="login">

<h2>Identificação do eleitor</h2>

<p>
Digite o ID do eleitor cadastrado para iniciar a votação.
</p>

<div id="erroLogin" class="erro"></div>

<input
id="eleitorId"
type="text"
inputmode="numeric"
placeholder="ID do eleitor"
autocomplete="off"
>

<button onclick="entrar()">
INICIAR VOTAÇÃO
</button>

</div>

</div>

<script>

const STATUS="cidadeAltaEleicaoStatus";
const PERIODO="cidadeAltaEleicaoPeriodo";
const CANDIDATOS="candidatosCidadeAlta";
const ELEITORES="eleitoresCidadeAlta";
const VOTOS="votosCidadeAlta";
const BLOQUEIO="cidadeAltaJaVotou2026";

const etapas=[
{
cargo:"federal",
nome:"DEPUTADO FEDERAL",
digitos:4
},
{
cargo:"estadual",
nome:"DEPUTADO ESTADUAL",
digitos:5
},
{
cargo:"governador",
nome:"GOVERNADOR",
digitos:2
},
{
cargo:"presidente",
nome:"PRESIDENTE",
digitos:2
}
];

let etapa=0;
let numeroAtual="";
let tipo="";
let eleitorAtual=null;
let candidatos={};

function lerJSON(chave,valor=[]){

try{
return JSON.parse(localStorage.getItem(chave))||valor;
}catch(e){
return valor;
}

}

function periodo(){

let p=lerJSON(PERIODO,null);

if(!p)return null;

return{
inicio:new Date(p.inicio),
fim:new Date(p.fim)
};

}

function verificarEleicao(){

let p=periodo();

if(!p){

bloquear(
"ELEIÇÃO NÃO CONFIGURADA",
"Procure a administração."
);

return false;

}

let agora=new Date();

if(agora<p.inicio){

bloquear(
"ELEIÇÃO AINDA NÃO INICIOU",
"Aguarde a abertura."
);

return false;

}

if(agora>=p.fim){

localStorage.setItem(STATUS,"encerrada");

bloquear(
"ELEIÇÃO ENCERRADA",
"Não é possível votar."
);

return false;

}

return true;

}

function bloquear(titulo,texto){

document.getElementById("loginOverlay").style.display="flex";

document.querySelector(".login").innerHTML=`
<h2>${titulo}</h2>
<p>${texto}</p>
<button onclick="location.href='index.html'">
VOLTAR
</button>
`;

}

function carregar(){

candidatos=lerJSON(CANDIDATOS,{});

}

function entrar(){

if(!verificarEleicao())return;

let id=document
.getElementById("eleitorId")
.value
.trim();

let erro=document.getElementById("erroLogin");

if(!id){

erro.textContent="Digite o ID do eleitor.";
erro.style.display="block";
return;

}

let lista=lerJSON(ELEITORES,[]);

let eleitor=lista.find(x=>String(x.id)===String(id));

if(!eleitor){

erro.textContent="Eleitor não encontrado.";
erro.style.display="block";
return;

}

if(eleitor.votou){

erro.textContent="Este eleitor já votou.";
erro.style.display="block";
return;

}

if(localStorage.getItem(BLOQUEIO)==="true"){

erro.textContent="Este dispositivo já registrou uma votação.";
erro.style.display="block";
return;

}

eleitorAtual=eleitor;

document.getElementById("loginOverlay").style.display="none";

carregar();
mostrar();

}

function mostrar(){

let e=etapas[etapa];

document.getElementById("cargoNome").textContent=e.nome;

document.getElementById("numero").textContent=
numeroAtual||"_";

let box=document.getElementById("candidato");

box.style.display="none";

if(numeroAtual.length===e.digitos){

let c=candidatos[e.cargo+"_"+numeroAtual];

if(c){

box.style.display="block";

document.getElementById("nome").textContent=c.nome||"";

document.getElementById("partido").textContent=
c.partido?"PARTIDO: "+c.partido:"";

let foto=document.getElementById("foto");

if(c.foto){
foto.src=c.foto;
foto.style.display="block";
}else{
foto.style.display="none";
}

}

}

}

function digitar(n){

if(!verificarEleicao())return;

let e=etapas[etapa];

if(tipo==="branco"){

tipo="";
numeroAtual="";

}

if(numeroAtual.length>=e.digitos)return;

numeroAtual+=n;

tipo="numero";

mostrar();

}

function buscar(){

let e=etapas[etapa];

if(numeroAtual.length!==e.digitos)return null;

return candidatos[e.cargo+"_"+numeroAtual]||null;

}

function branco(){

if(!verificarEleicao())return;

numeroAtual="";
tipo="branco";

document.getElementById("numero").textContent="BRANCO";

document.getElementById("candidato").style.display="none";

}

function corrigir(){

numeroAtual="";
tipo="";

mostrar();

}

function votosBase(){

return{
federal:{},
estadual:{},
governador:{},
presidente:{},
brancos:{
federal:0,
estadual:0,
governador:0,
presidente:0
},
nulos:{
federal:0,
estadual:0,
governador:0,
presidente:0
}
};

}

function confirmar(){

if(!verificarEleicao())return;

let e=etapas[etapa];

let votos=lerJSON(VOTOS,votosBase());

if(!votos.federal)votos.federal={};
if(!votos.estadual)votos.estadual={};
if(!votos.governador)votos.governador={};
if(!votos.presidente)votos.presidente={};

if(!votos.brancos)votos.brancos={};
if(!votos.nulos)votos.nulos={};

if(tipo==="branco"){

votos.brancos[e.cargo]=
Number(votos.brancos[e.cargo]||0)+1;

}else{

let candidato=buscar();

if(!candidato){

if(numeroAtual.length!==e.digitos){

alert("Digite todos os números.");

return;

}

votos.nulos[e.cargo]=
Number(votos.nulos[e.cargo]||0)+1;

}else{

votos[e.cargo][numeroAtual]=
Number(votos[e.cargo][numeroAtual]||0)+1;

}

}

localStorage.setItem(VOTOS,JSON.stringify(votos));

if(etapa<etapas.length-1){

etapa++;

numeroAtual="";
tipo="";

mostrar();

return;

}

finalizar();

}

function finalizar(){

if(!eleitorAtual)return;

let lista=lerJSON(ELEITORES,[]);

let encontrado=lista.find(
x=>String(x.id)===String(eleitorAtual.id)
);

if(encontrado){

encontrado.votou=true;

encontrado.dataVoto=new Date().toISOString();

salvarEleitores(lista);

}

localStorage.setItem(BLOQUEIO,"true");

document.getElementById("conteudo").innerHTML=`

<div class="mensagem">
VOTO CONFIRMADO!
<br><br>
Obrigado por participar.
</div>

`;

document.querySelector(".teclado").style.display="none";

}

function salvarEleitores(lista){

localStorage.setItem(
ELEITORES,
JSON.stringify(lista)
);

}

function fechar(){

document.getElementById("loginOverlay").style.display="none";

}

setInterval(()=>{

if(verificarEleicao()===false)return;

},1000);

</script>

</body>
</html>
