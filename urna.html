<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urna Eletrônica | Cidade Alta RP</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:#d8d8d8;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.urna{
    width:100%;
    max-width:850px;
    background:#bdbdbd;
    border:2px solid #888;
    border-radius:12px;
    padding:25px;
    box-shadow:
        0 20px 45px rgba(0,0,0,.3),
        inset 0 2px 3px rgba(255,255,255,.5);
}

.topo{
    text-align:center;
    margin-bottom:20px;
    color:#222;
}

.topo h1{
    font-size:18px;
    letter-spacing:2px;
}

.topo p{
    font-size:11px;
    margin-top:5px;
    color:#555;
}

.area{
    display:grid;
    grid-template-columns:1fr 270px;
    gap:25px;
    align-items:start;
}

.tela-frame{
    background:#111;
    padding:18px;
    border-radius:7px;
    box-shadow:inset 0 0 0 2px #333;
}

.tela{
    min-height:390px;
    background:#d9e0d1;
    border:3px solid #777;
    padding:25px;
    color:#111;
    box-shadow:inset 0 0 25px rgba(0,0,0,.15);
}

.titulo-cargo{
    font-weight:bold;
    font-size:17px;
    margin-bottom:25px;
}

.numero{
    font-size:32px;
    letter-spacing:7px;
    border-bottom:2px solid #333;
    min-height:45px;
    margin-bottom:20px;
}

.info{
    min-height:140px;
}

.info strong{
    display:block;
    font-size:18px;
    margin-bottom:8px;
}

.info p{
    font-size:15px;
    margin:5px 0;
}

.foto{
    width:100px;
    height:120px;
    object-fit:cover;
    border:2px solid #333;
    margin-top:10px;
    display:none;
}

.mensagem{
    margin-top:20px;
    font-weight:bold;
    font-size:15px;
}

.teclado{
    background:#222;
    border-radius:8px;
    padding:15px;
    box-shadow:inset 0 0 0 2px #111;
}

.numeros{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    margin-bottom:14px;
}

.key{
    height:55px;
    background:#111;
    border:1px solid #555;
    color:#fff;
    border-radius:5px;
    font-size:21px;
    font-weight:bold;
    box-shadow:0 3px 0 #000;
}

.key:active{
    transform:translateY(2px);
    box-shadow:none;
}

.botoes{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.botoes button{
    min-height:52px;
    border:0;
    border-radius:5px;
    font-weight:bold;
    font-size:11px;
}

.branco{
    background:#fff;
    color:#111;
}

.corrige{
    background:#eab308;
    color:#111;
}

.confirma{
    background:#16a34a;
    color:#fff;
}

.contador{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
    font-size:12px;
    color:#333;
}

.modal-bg{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    align-items:center;
    justify-content:center;
    z-index:99;
    padding:20px;
}

.modal{
    background:#fff;
    max-width:420px;
    width:100%;
    border-radius:16px;
    padding:25px;
    text-align:center;
}

.modal h2{
    margin-bottom:10px;
}

.modal p{
    color:#666;
    line-height:1.5;
    margin-bottom:20px;
}

.modal button{
    background:#111;
    color:#fff;
    border:0;
    padding:12px 20px;
    border-radius:9px;
    font-weight:bold;
}

@media(max-width:700px){

    .area{
        grid-template-columns:1fr;
    }

    .tela{
        min-height:330px;
    }

    .teclado{
        max-width:400px;
        margin:auto;
        width:100%;
    }

}
</style>
</head>

<body>

<div class="urna">

    <div class="topo">
        <h1>JUSTIÇA ELEITORAL</h1>
        <p>CIDADE ALTA RP • ELEIÇÕES 2026</p>
    </div>

    <div class="area">

        <div class="tela-frame">

            <div class="tela">

                <div class="titulo-cargo" id="cargoTela">
                    DEPUTADO ESTADUAL
                </div>

                <div class="numero" id="numeroTela"></div>

                <div class="info">

                    <strong id="nomeCandidato"></strong>

                    <p id="partidoCandidato"></p>

                    <img id="fotoCandidato" class="foto">

                    <div class="mensagem" id="mensagem"></div>

                </div>

            </div>

        </div>

        <div>

            <div class="teclado">

                <div class="numeros">

                    <button class="key" onclick="digitar('1')">1</button>
                    <button class="key" onclick="digitar('2')">2</button>
                    <button class="key" onclick="digitar('3')">3</button>

                    <button class="key" onclick="digitar('4')">4</button>
                    <button class="key" onclick="digitar('5')">5</button>
                    <button class="key" onclick="digitar('6')">6</button>

                    <button class="key" onclick="digitar('7')">7</button>
                    <button class="key" onclick="digitar('8')">8</button>
                    <button class="key" onclick="digitar('9')">9</button>

                    <div></div>
                    <button class="key" onclick="digitar('0')">0</button>
                    <div></div>

                </div>

                <div class="botoes">

                    <button class="branco" onclick="branco()">
                        BRANCO
                    </button>

                    <button class="corrige" onclick="corrigir()">
                        CORRIGE
                    </button>

                    <button class="confirma" onclick="confirmar()">
                        CONFIRMA
                    </button>

                </div>

            </div>

            <div class="contador" id="contador">
                Verificando período da votação...
            </div>

        </div>

    </div>

</div>

<div id="modalBg" class="modal-bg">

    <div class="modal">

        <h2 id="modalTitulo">Votação encerrada</h2>

        <p id="modalTexto">
            A votação não está disponível neste momento.
        </p>

        <button onclick="location.reload()">
            Voltar
        </button>

    </div>

</div>

<script>

const STATUS_KEY = "cidadeAltaEleicaoStatus";
const CONFIG_KEY = "cidadeAltaEleicaoPeriodo";

const etapas = [

    {
        cargo:"estadual",
        nome:"DEPUTADO ESTADUAL",
        digitos:5
    },

    {
        cargo:"governador",
        nome:"GOVERNADOR",
        digitos:2
    },

    {
        cargo:"prefeito",
        nome:"PREFEITO",
        digitos:2
    }

];

let etapaAtual = 0;
let votoAtual = "";
let candidatoAtual = null;
let podeVotar = false;

let intervalo = null;

function obterPeriodo(){

    try{

        return JSON.parse(
            localStorage.getItem(CONFIG_KEY)
        );

    }catch(e){

        return null;

    }

}

function verificarPeriodo(){

    const periodo = obterPeriodo();

    if(!periodo){

        bloquear(
            "A votação ainda não foi programada.",
            "Aguarde a administração abrir a urna."
        );

        return false;

    }

    const agora = new Date();

    const inicio = new Date(periodo.inicio);
    const fim = new Date(periodo.fim);

    if(agora < inicio){

        bloquear(
            "Votação ainda não iniciada",
            "A urna será liberada no horário programado."
        );

        atualizarContador(inicio,true);

        return false;

    }

    if(agora >= fim){

        localStorage.setItem(
            STATUS_KEY,
            "encerrada"
        );

        bloquear(
            "Votação encerrada",
            "O período definido para esta eleição terminou."
        );

        atualizarContador(fim,false);

        return false;

    }

    localStorage.setItem(
        STATUS_KEY,
        "aberta"
    );

    podeVotar = true;

    iniciarContador(fim);

    return true;

}

function bloquear(titulo,texto){

    podeVotar = false;

    document.querySelectorAll("button").forEach(btn=>{
        btn.disabled = true;
        btn.style.opacity = ".45";
    });

    document.getElementById("modalTitulo").textContent = titulo;
    document.getElementById("modalTexto").textContent = texto;

    document.getElementById("modalBg").style.display = "flex";

}

function iniciarContador(destino){

    if(intervalo) return;

    intervalo = setInterval(()=>{

        const agora = new Date();
        const periodo = obterPeriodo();

        if(!periodo){

            clearInterval(intervalo);
            intervalo = null;

            bloquear(
                "Votação indisponível",
                "O período da eleição não está configurado."
            );

            return;

        }

        const inicio = new Date(periodo.inicio);
        const fim = new Date(periodo.fim);

        if(agora < inicio){

            atualizarContador(inicio,true);

            return;

        }

        if(agora >= fim){

            clearInterval(intervalo);
            intervalo = null;

            localStorage.setItem(
                STATUS_KEY,
                "encerrada"
            );

            bloquear(
                "Votação encerrada",
                "O horário de encerramento da eleição foi atingido."
            );

            atualizarContador(fim,false);

            return;

        }

        atualizarContador(fim,false);

    },1000);

}

function atualizarContador(destino,antes){

    const agora = new Date();

    let ms = destino - agora;

    if(ms < 0) ms = 0;

    let total = Math.floor(ms/1000);

    const dias = Math.floor(total/86400);

    total %= 86400;

    const horas = Math.floor(total/3600);

    total %= 3600;

    const minutos = Math.floor(total/60);

    const segundos = total % 60;

    let tempo;

    if(dias > 0){

        tempo =
            `${dias}d ${String(horas).padStart(2,"0")}:` +
            `${String(minutos).padStart(2,"0")}:` +
            `${String(segundos).padStart(2,"0")}`;

    }else{

        tempo =
            `${String(horas).padStart(2,"0")}:` +
            `${String(minutos).padStart(2,"0")}:` +
            `${String(segundos).padStart(2,"0")}`;

    }

    document.getElementById("contador").textContent =
        antes
        ? "Votação inicia em " + tempo
        : "Votação encerra em " + tempo;

}

function carregarCandidatos(){

    try{

        return JSON.parse(
            localStorage.getItem("candidatosCidadeAlta")
        ) || {};

    }catch(e){

        return {};

    }

}

function obterVotos(){

    try{

        const dados = JSON.parse(
            localStorage.getItem("votosCidadeAlta")
        );

        if(dados) return dados;

    }catch(e){}

    return {

        estadual:{},
        governador:{},
        prefeito:{},

        brancos:{
            estadual:0,
            governador:0,
            prefeito:0
        },

        nulos:{
            estadual:0,
            governador:0,
            prefeito:0
        }

    };

}

function salvarVotos(votos){

    localStorage.setItem(
        "votosCidadeAlta",
        JSON.stringify(votos)
    );

}

function iniciar(){

    if(localStorage.getItem("cidadeAltaJaVotou2026") === "true"){

        bloquear(
            "Voto já realizado",
            "Este dispositivo já realizou uma votação."
        );

        return;

    }

    if(!verificarPeriodo()) return;

    carregarEtapa();

}

function carregarEtapa(){

    if(!podeVotar) return;

    const etapa = etapas[etapaAtual];

    document.getElementById("cargoTela").textContent =
        etapa.nome;

    document.getElementById("numeroTela").textContent = "";

    document.getElementById("nomeCandidato").textContent = "";

    document.getElementById("partidoCandidato").textContent = "";

    document.getElementById("mensagem").textContent = "";

    const foto = document.getElementById("fotoCandidato");

    foto.style.display = "none";
    foto.removeAttribute("src");

    votoAtual = "";
    candidatoAtual = null;

}

function digitar(numero){

    if(!podeVotar) return;

    const etapa = etapas[etapaAtual];

    if(votoAtual === "branco") return;

    if(votoAtual.length >= etapa.digitos) return;

    votoAtual += numero;

    document.getElementById("numeroTela").textContent =
        votoAtual;

    tocarBeep();

    buscarCandidato();

}

function buscarCandidato(){

    const etapa = etapas[etapaAtual];

    if(votoAtual.length !== etapa.digitos){

        limparInfo();

        return;

    }

    const candidatos = carregarCandidatos();

    const chave =
        etapa.cargo + "_" + votoAtual;

    candidatoAtual = candidatos[chave] || null;

    if(candidatoAtual){

        document.getElementById("nomeCandidato").textContent =
            candidatoAtual.nome;

        document.getElementById("partidoCandidato").textContent =
            "Partido: " + candidatoAtual.partido;

        const foto =
            document.getElementById("fotoCandidato");

        if(candidatoAtual.foto){

            foto.src = candidatoAtual.foto;
            foto.style.display = "block";

        }

        document.getElementById("mensagem").textContent =
            "CONFIRME SEU VOTO";

    }else{

        limparInfo();

        document.getElementById("mensagem").textContent =
            "NÚMERO NÃO ENCONTRADO";

        tocarErro();

    }

}

function limparInfo(){

    document.getElementById("nomeCandidato").textContent = "";
    document.getElementById("partidoCandidato").textContent = "";

    const foto =
        document.getElementById("fotoCandidato");

    foto.style.display = "none";
    foto.removeAttribute("src");

}

function branco(){

    if(!podeVotar) return;

    votoAtual = "branco";
    candidatoAtual = null;

    document.getElementById("numeroTela").textContent =
        "";

    limparInfo();

    document.getElementById("mensagem").textContent =
        "VOTO EM BRANCO";

    tocarBeep();

}

function corrigir(){

    if(!podeVotar) return;

    carregarEtapa();

    tocarBeep();

}

function confirmar(){

    if(!podeVotar) return;

    if(votoAtual === ""){

        document.getElementById("mensagem").textContent =
            "DIGITE UM NÚMERO OU BRANCO";

        tocarErro();

        return;

    }

    const etapa = etapas[etapaAtual];

    const votos = obterVotos();

    if(votoAtual === "branco"){

        votos.brancos[etapa.cargo] =
            Number(votos.brancos[etapa.cargo] || 0) + 1;

    }else if(candidatoAtual){

        votos[etapa.cargo][votoAtual] =
            Number(votos[etapa.cargo][votoAtual] || 0) + 1;

    }else{

        votos.nulos[etapa.cargo] =
            Number(votos.nulos[etapa.cargo] || 0) + 1;

    }

    salvarVotos(votos);

    tocarConfirmacao();

    etapaAtual++;

    if(etapaAtual >= etapas.length){

        finalizar();

        return;

    }

    document.getElementById("mensagem").textContent =
        "VOTO CONFIRMADO!";

    setTimeout(()=>{

        carregarEtapa();

    },900);

}

function finalizar(){

    localStorage.setItem(
        "cidadeAltaJaVotou2026",
        "true"
    );

    podeVotar = false;

    document.querySelectorAll("button").forEach(btn=>{
        btn.disabled = true;
        btn.style.opacity = ".45";
    });

    document.getElementById("cargoTela").textContent =
        "FIM DA VOTAÇÃO";

    document.getElementById("numeroTela").textContent =
        "";

    limparInfo();

    document.getElementById("mensagem").textContent =
        "VOTO CONFIRMADO!";

    document.getElementById("contador").textContent =
        "Obrigado por participar.";

}

function tocarBeep(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx = new AudioContext();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.frequency.value = 700;
        gain.gain.value = .05;

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();

        setTimeout(()=>{

            osc.stop();
            ctx.close();

        },70);

    }catch(e){}

}

function tocarErro(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx = new AudioContext();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.frequency.value = 180;
        gain.gain.value = .06;

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();

        setTimeout(()=>{

            osc.stop();
            ctx.close();

        },300);

    }catch(e){}

}

function tocarConfirmacao(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx = new AudioContext();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.frequency.value = 900;
        gain.gain.value = .05;

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();

        setTimeout(()=>{

            osc.frequency.value = 1200;

        },100);

        setTimeout(()=>{

            osc.stop();
            ctx.close();

        },250);

    }catch(e){}

}

iniciar();

setInterval(()=>{

    if(!podeVotar) return;

    verificarPeriodo();

},1000);

</script>

</body>
</html>
