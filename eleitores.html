<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eleitores - Cidade Alta RP</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
min-height:100vh;
font-family:Arial,sans-serif;
background:
radial-gradient(circle at top,#303030,#0b0b0b 65%);
color:#fff;
padding:20px
}

.container{
width:100%;
max-width:1000px;
margin:auto;
background:#151515;
border:1px solid #333;
border-radius:20px;
overflow:hidden;
box-shadow:0 25px 80px #000
}

.topo{
padding:25px;
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
background:linear-gradient(135deg,#222,#111);
border-bottom:1px solid #333
}

.marca{
display:flex;
align-items:center;
gap:15px
}

.logo{
width:58px;
height:58px;
border-radius:50%;
background:#fff;
color:#111;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:20px;
box-shadow:0 0 0 4px #333
}

.topo h1{
font-size:23px
}

.topo p{
color:#999;
font-size:13px;
margin-top:4px
}

.voltar{
background:#333;
color:#fff;
border:0;
border-radius:8px;
padding:12px 18px;
font-weight:bold;
cursor:pointer
}

.conteudo{
padding:25px
}

.estatisticas{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-bottom:25px
}

.card{
background:#202020;
border:1px solid #333;
border-radius:12px;
padding:18px;
text-align:center
}

.card .numero{
font-size:27px;
font-weight:bold
}

.card .titulo{
font-size:12px;
color:#999;
margin-top:6px
}

.adicionar{
background:#202020;
border:1px solid #333;
border-radius:14px;
padding:20px;
margin-bottom:20px
}

.adicionar h2{
font-size:18px;
margin-bottom:15px
}

.form{
display:grid;
grid-template-columns:1fr auto;
gap:10px
}

.form input{
height:46px;
background:#252525;
border:1px solid #444;
border-radius:8px;
padding:0 13px;
color:#fff;
outline:none
}

.form input:focus{
border-color:#777
}

.btn-adicionar{
height:46px;
padding:0 22px;
border:0;
border-radius:8px;
background:#168b35;
color:#fff;
font-weight:bold;
cursor:pointer
}

.pesquisa{
margin-bottom:15px
}

.pesquisa input{
width:100%;
height:45px;
background:#202020;
border:1px solid #333;
border-radius:8px;
padding:0 14px;
color:#fff;
outline:none
}

.lista{
display:flex;
flex-direction:column;
gap:10px
}

.eleitor{
background:#202020;
border:1px solid #333;
border-radius:12px;
padding:15px;
display:flex;
align-items:center;
gap:15px
}

.avatar{
width:45px;
height:45px;
border-radius:50%;
background:#333;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:18px;
flex-shrink:0
}

.info{
flex:1;
min-width:0
}

.nome{
font-size:16px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.id{
font-size:11px;
color:#666;
margin-top:4px
}

.status{
font-size:11px;
font-weight:bold;
padding:6px 9px;
border-radius:15px;
white-space:nowrap
}

.pendente{
background:#40370e;
color:#e7cf48
}

.votou{
background:#173d24;
color:#45df7b
}

.acoes{
display:flex;
gap:7px
}

.acao{
border:0;
border-radius:7px;
padding:8px 10px;
font-size:11px;
font-weight:bold;
cursor:pointer
}

.resetar{
background:#333;
color:#fff
}

.excluir{
background:#651d1d;
color:#ff9a9a
}

.vazio{
text-align:center;
padding:45px 20px;
color:#777;
background:#1b1b1b;
border:1px solid #2d2d2d;
border-radius:12px
}

.rodape{
padding:20px;
text-align:center;
border-top:1px solid #292929;
color:#666;
font-size:12px
}

@media(max-width:700px){

.estatisticas{
grid-template-columns:1fr
}

.form{
grid-template-columns:1fr
}

.eleitor{
flex-wrap:wrap
}

.acoes{
width:100%
}

.acao{
flex:1
}

}

@media(max-width:500px){

body{
padding:8px
}

.conteudo{
padding:15px
}

.topo h1{
font-size:18px
}

.logo{
width:48px;
height:48px
}

}

</style>
</head>

<body>

<div class="container">

<div class="topo">

<div class="marca">

<div class="logo">
CA
</div>

<div>

<h1>Gerenciamento de Eleitores</h1>

<p>
Cidade Alta RP • Eleições 2026
</p>

</div>

</div>

<button class="voltar" onclick="voltar()">
VOLTAR
</button>

</div>


<div class="conteudo">


<!-- ESTATÍSTICAS -->

<div class="estatisticas">

<div class="card">

<div class="numero" id="total">
0
</div>

<div class="titulo">
TOTAL DE ELEITORES
</div>

</div>

<div class="card">

<div class="numero" id="votaram">
0
</div>

<div class="titulo">
JÁ VOTARAM
</div>

</div>

<div class="card">

<div class="numero" id="faltam">
0
</div>

<div class="titulo">
AINDA NÃO VOTARAM
</div>

</div>

</div>


<!-- ADICIONAR -->

<div class="adicionar">

<h2>
➕ Adicionar eleitor
</h2>

<div class="form">

<input
id="nome"
type="text"
placeholder="Nome completo do eleitor"
autocomplete="off"
>

<button
class="btn-adicionar"
onclick="adicionar()"
>
ADICIONAR
</button>

</div>

</div>


<!-- PESQUISA -->

<div class="pesquisa">

<input
id="pesquisa"
type="text"
placeholder="🔎 Pesquisar eleitor..."
oninput="carregar()"
>

</div>


<!-- LISTA -->

<div class="lista" id="lista">
</div>


</div>


<div class="rodape">
Cidade Alta RP • Sistema Administrativo Eleitoral 2026
</div>

</div>


<script>

const CHAVE="eleitoresCidadeAlta";


function getEleitores(){

try{

const dados=
localStorage.getItem(CHAVE);

if(!dados)
return [];

const lista=
JSON.parse(dados);

return Array.isArray(lista)
?lista
:[];

}catch(e){

return [];

}

}


function salvar(lista){

try{

localStorage.setItem(
CHAVE,
JSON.stringify(lista)
);

return true;

}catch(e){

return false;

}

}


function adicionar(){

const campo=
document.getElementById("nome");

const nome=
campo.value.trim();

if(!nome){

alert(
"Digite o nome do eleitor."
);

campo.focus();

return;

}


const lista=
getEleitores();


const existe=
lista.some(
e=>
String(e.nome)
.toLowerCase()
===
nome.toLowerCase()
);


if(existe){

alert(
"Esse eleitor já está cadastrado."
);

return;

}


const eleitor={

id:
Date.now().toString(),

nome:nome,

votou:false

};


lista.push(eleitor);


if(!salvar(lista)){

alert(
"Não foi possível salvar o eleitor."
);

return;

}


campo.value="";

carregar();

}


function carregar(){

const lista=
getEleitores();

const pesquisa=
document
.getElementById("pesquisa")
.value
.trim()
.toLowerCase();


const filtrados=
lista.filter(
e=>
String(e.nome)
.toLowerCase()
.includes(pesquisa)
);


let votaram=0;


lista.forEach(e=>{

if(e.votou)
votaram++;

});


document.getElementById("total")
.textContent=
lista.length;


document.getElementById("votaram")
.textContent=
votaram;


document.getElementById("faltam")
.textContent=
lista.length-votaram;


const area=
document.getElementById("lista");

area.innerHTML="";


if(!filtrados.length){

area.innerHTML=`

<div class="vazio">

${
lista.length
?"Nenhum eleitor encontrado."
:"Nenhum eleitor cadastrado."
}

</div>

`;

return;

}


filtrados.forEach(
eleitor=>{

const div=
document.createElement("div");

div.className="eleitor";


const inicial=
String(eleitor.nome||"?")
.charAt(0)
.toUpperCase();


const status=
eleitor.votou
?`
<span class="status votou">
✓ JÁ VOTOU
</span>
`
:`
<span class="status pendente">
● NÃO VOTOU
</span>
`;


div.innerHTML=`

<div class="avatar">
${escapar(inicial)}
</div>

<div class="info">

<div class="nome">
${escapar(eleitor.nome)}
</div>

<div class="id">
ID: ${escapar(eleitor.id)}
</div>

</div>

${status}

<div class="acoes">

<button
class="acao resetar"
onclick="resetarVoto('${eleitor.id}')"
>
RESETAR
</button>

<button
class="acao excluir"
onclick="excluir('${eleitor.id}')"
>
EXCLUIR
</button>

</div>

`;


area.appendChild(div);

});

}


function resetarVoto(id){

const lista=
getEleitores();

const eleitor=
lista.find(
e=>e.id===id
);

if(!eleitor)
return;


if(!eleitor.votou){

alert(
"Esse eleitor ainda não votou."
);

return;

}


const confirmar=
window.confirm(
"Resetar o status de voto deste eleitor?"
);


if(!confirmar)
return;


eleitor.votou=false;


if(salvar(lista)){

carregar();

}else{

alert(
"Não foi possível salvar a alteração."
);

}

}


function excluir(id){

const lista=
getEleitores();

const eleitor=
lista.find(
e=>e.id===id
);

if(!eleitor)
return;


const confirmar=
window.confirm(
"Excluir o eleitor "+eleitor.nome+"?"
);


if(!confirmar)
return;


const novaLista=
lista.filter(
e=>e.id!==id
);


if(salvar(novaLista)){

carregar();

}else{

alert(
"Não foi possível excluir o eleitor."
);

}

}


function escapar(texto){

return String(texto||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function voltar(){

window.location.href=
"admin.html";

}


document
.getElementById("nome")
.addEventListener(
"keydown",
function(e){

if(e.key==="Enter")
adicionar();

}
);


carregar();

</script>

</body>
</html>
