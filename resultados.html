<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Resultados - Cidade Alta RP</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f1f3f5;
    color:#222;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
}

.topo{
    background:#fff;
    border:1px solid #e1e1e1;
    border-radius:16px;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.topo h1{
    font-size:22px;
}

.topo p{
    color:#777;
    font-size:13px;
    margin-top:5px;
}

.voltar,.atualizar{
    border:0;
    background:#222;
    color:#fff;
    padding:11px 15px;
    border-radius:8px;
    font-size:13px;
    font-weight:bold;
    text-decoration:none;
    cursor:pointer;
}

.cargo{
    background:#fff;
    border:1px solid #e1e1e1;
    border-radius:16px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.cargo h2{
    font-size:18px;
    margin-bottom:15px;
}

.candidato{
    border:1px solid #ddd;
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
}

.candidato:last-child{
    margin-bottom:0;
}

.linha{
    display:flex;
    align-items:center;
    gap:14px;
}

.foto{
    width:62px;
    height:62px;
    object-fit:cover;
    border-radius:9px;
    background:#eee;
}

.info{
    flex:1;
}

.nome{
    font-weight:900;
}

.partido{
    color:#777;
    font-size:12px;
    margin-top:4px;
}

.votos{
    font-size:20px;
    font-weight:900;
}

.percentual{
    color:#777;
    font-size:12px;
    margin-top:3px;
    text-align:right;
}

.barra{
    height:8px;
    background:#eee;
    border-radius:20px;
    overflow:hidden;
    margin-top:10px;
}

.progresso{
    height:100%;
    background:#168a42;
}

.destaque{
    display:inline-block;
    margin-top:7px;
    padding:4px 7px;
    border-radius:5px;
    background:#168a42;
    color:#fff;
    font-size:10px;
    font-weight:900;
}

.resumo{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:15px;
}

.resumo div{
    background:#f5f5f5;
    padding:11px;
    border-radius:8px;
    text-align:center;
}

.resumo strong{
    display:block;
    font-size:17px;
}

.resumo span{
    color:#777;
    font-size:10px;
}

.sem{
    color:#777;
    padding:10px 0;
}

@media(max-width:650px){

    .topo{
        align-items:flex-start;
        gap:12px;
    }

    .linha{
        align-items:flex-start;
    }

    .votos{
        font-size:17px;
    }

    .resumo{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<div class="container">

<header class="topo">

<div>
<h1>Resultados da Eleição</h1>
<p>Cidade Alta RP • Eleições 2026</p>
</div>

<div style="display:flex;gap:8px">

<button
class="atualizar"
onclick="renderizar()"
>
Atualizar
</button>

<a
href="admin.html"
class="voltar"
>
Voltar
</a>

</div>

</header>


<div id="resultados"></div>

</div>


<script>

const cargos = [

{
id:"estadual",
nome:"Deputado Estadual"
},

{
id:"governador",
nome:"Governador"
},

{
id:"prefeito",
nome:"Prefeito"
}

];


function carregar(){

return JSON.parse(
localStorage.getItem(
"candidatosCidadeAlta"
)
) || {};

}


function carregarVotos(){

return JSON.parse(
localStorage.getItem(
"votosCidadeAlta"
)
) || {

estadual:{},
governador:{},
prefeito:{},

brancos:{
estadual:0,
governador:0,
prefeito:0
},

nulos:{
estadual:0,
governador:0,
prefeito:0
}

};

}


function renderizar(){

const candidatos =
carregar();

const votos =
carregarVotos();

const area =
document.getElementById("resultados");

area.innerHTML = "";


cargos.forEach(cargo=>{

const bloco =
document.createElement("section");

bloco.className =
"cargo";


const candidatosCargo =
Object.values(candidatos)
.filter(c =>
c.cargo === cargo.id
);


const votosCargo =
votos[cargo.id] || {};


let totalValidos = 0;


candidatosCargo.forEach(c=>{

totalValidos +=
votosCargo[c.numero] || 0;

});


const brancos =
votos.brancos?.[cargo.id] || 0;

const nulos =
votos.nulos?.[cargo.id] || 0;


let total =
totalValidos +
brancos +
nulos;


candidatosCargo.sort((a,b)=>
(votosCargo[b.numero] || 0) -
(votosCargo[a.numero] || 0)
);


let html = `
<h2>${cargo.nome}</h2>
`;


if(!candidatosCargo.length){

html += `
<div class="sem">
Nenhum candidato cadastrado.
</div>
`;

}else{

const maior =
votosCargo[
candidatosCargo[0].numero
] || 0;


candidatosCargo.forEach(c=>{

const quantidade =
votosCargo[c.numero] || 0;

const percentual =
totalValidos > 0
?
(quantidade / totalValidos * 100)
:
0;

const largura =
totalValidos > 0
?
percentual
:
0;


html += `

<div class="candidato">

<div class="linha">

<img
class="foto"
src="${c.foto || ""}"
>

<div class="info">

<div class="nome">
${c.nome}
</div>

<div class="partido">
Nº ${c.numero} • ${c.partido}
</div>

${quantidade === maior && maior > 0
?
`<span class="destaque">MAIS VOTADO</span>`
:
""}

</div>

<div>

<div class="votos">
${quantidade}
</div>

<div class="percentual">
${percentual.toFixed(1)}%
</div>

</div>

</div>

<div class="barra">

<div
class="progresso"
style="width:${largura}%"
></div>

</div>

</div>

`;

});

}


html += `

<div class="resumo">

<div>
<strong>${totalValidos}</strong>
<span>VOTOS VÁLIDOS</span>
</div>

<div>
<strong>${brancos}</strong>
<span>BRANCOS</span>
</div>

<div>
<strong>${nulos}</strong>
<span>NULOS</span>
</div>

<div>
<strong>${total}</strong>
<span>TOTAL</span>
</div>

</div>

`;


bloco.innerHTML =
html;

area.appendChild(bloco);

});

}


renderizar();

</script>

</body>
</html>
